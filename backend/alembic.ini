[alembic]
script_location = backend/alembic
# sqlalchemy.url can be overridden via env var DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/cafe

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
